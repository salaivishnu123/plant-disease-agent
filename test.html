<!DOCTYPE html>
<html>
<head>
    <title>Plant Disease Detector</title>
</head>
<body>

    <h1>🌿 Plant Disease Detection</h1>

    <input type="file" id="imageInput">
    <button onclick="uploadImage()">Predict</button>

    <h2 id="result"></h2>
    <p id="confidence"></p>

    <h3>Grad-CAM:</h3>
    <img id="gradcam" width="300">

    <h3>AI Explanation:</h3>
    <p id="llm"></p>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const formData = new FormData();
            formData.append("image", fileInput.files[0]);

            const response = await fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            document.getElementById("result").innerText = "Disease: " + data.disease;
            document.getElementById("confidence").innerText = "Confidence: " + data.confidence;
            document.getElementById("gradcam").src = data.gradcam_image;
            document.getElementById("llm").innerText = data.llm_explanation;
        }
    </script>

</body>
</html>
